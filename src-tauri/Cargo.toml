[package]
name = "calliope"
version = "0.1.0-beta.1"
description = "Calliope desktop music player"
authors = ["Calliope"]
edition = "2021"

[lib]
name = "calliope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
